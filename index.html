async function payInv(i){const v=st.invoices[i];if(v.paid)return;const a=v.total||v.amt;await post(today(),'PAY '+(v.no||'#'+v.n)+' '+v.who,v.cur,[{a:'1100',dr:a,cr:0},{a:'1200',dr:0,cr:a}]);v.paid=true;await save();draw()}
function printInv(i){const v=st.invoices[i],it=v.items||[{d:v.who,q:1,p:v.amt}],f=x=>fmt(x,v.cur),bd='border-bottom:1px solid #000',lg=st.logo&&st.logo.startsWith('data:image/')?`<img src="${esc(st.logo)}" style="max-height:70px;max-width:200px">`:'<span></span>';
$('#pv').innerHTML=`<div style="font:14px/1.5 sans-serif;color:#000;padding:24px;max-width:720px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center">${lg}<div style="text-align:right"><b style="font-size:22px">INVOICE</b><br>${esc(v.no||'#'+v.n)}</div></div>${coBlock()}<p>${t('who')}: <b>${esc(v.who)}</b><br>${t('date')}: ${esc(v.date||'')}<br>${t('due')}: ${esc(v.due||'')}</p><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;${bd}">${t('item')}</th><th style="${bd}">${t('qty')}</th><th style="text-align:right;${bd}">${t('price')}</th><th style="text-align:right;${bd}">${t('amt')}</th></tr>${it.map(x=>`<tr><td>${esc(x.d)}</td><td align="center">${x.q}</td><td align="right">${f(x.p)}</td><td align="right">${f(x.q*x.p)}</td></tr>`).join('')}</table><p style="text-align:right">${t('sub')}: ${f(v.sub||v.amt)}<br>${t('tax')} ${v.tax||0}: ${f(v.taxAmt||0)}<br><b>${t('tot')}: ${f(v.total||v.amt)}</b></p></div>`;window.print()}
function bank(){return`<div class="card"><p class="mut">${t('bankh')}</p><div class="row"><label>${t('cur')}<select id="bc">${opt(curs(),disp)}</select></label><button class="b" onclick="recon()">${t('run')}</button></div><p><textarea id="bt" rows="6" style="width:100%;font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line)"></textarea></p><div id="br" class="sc"></div></div>`}
function recon(){const cur=$('#bc').value,used=new Set();const cands=st.entries.filter(e=>e.cur===cur).map(e=>({e,v:e.lines.filter(l=>l.a==='1100').reduce((s,l)=>s+l.dr-l.cr,0)})).filter(x=>x.v);
const out=$('#bt').value.split('\n').map(x=>x.trim()).filter(Boolean).map(ln=>{const p=ln.split(','),a=parseFloat(p[p.length-1]),d=p.slice(0,-1).join(',');const i=cands.findIndex((c,j)=>!used.has(j)&&Math.abs(c.v-a)<0.005);if(i>=0)used.add(i);return`<tr><td>${esc(d)}</td><td class="n">${isNaN(a)?'?':fmt(a,cur)}</td><td class="${i>=0?'ok':'bad'}">${i>=0?t('match')+' #'+cands[i].e.id:t('unm')}</td></tr>`}).join('');
$('#br').innerHTML=`<table>${out}</table>`}
function exportCsv(){const q=x=>{x=String(x);if(/^[=+\-@]/.test(x))x="'"+x;return'"'+x.replace(/"/g,'""')+'"'};
const rows=[['id','date','desc','currency','rate','account','debit','credit']];st.entries.forEach(e=>e.lines.forEach(l=>rows.push([e.id,e.date,e.desc,e.cur,e.rate,l.a,l.dr,l.cr])));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='jurnal.csv';a.click()}
function auto(){const rows=st.rules.map((r,i)=>`<tr><td>${esc(r.desc)}</td><td>${esc(r.d)} → ${esc(r.c)}</td><td class="n">${fmt(r.amt,r.cur)}</td><td>${r.every}</td><td>${esc(r.next)}</td><td><button class="b g" onclick="delR(${i})">×</button></td></tr>`).join('');
return`<div class="card"><h3>${t('rules')}</h3><p class="mut">${t('ruleh')}</p><div class="row"><label>${t('desc')}<input id="rt"></label><label>${t('dr')}<select id="rd">${opt(accOpts(),'5200')}</select></label><label>${t('cr')}<select id="rc">${opt(accOpts())}</select></label><label>${t('amt')}<input id="ra" type="number" min="0" step="any" style="width:120px"></label><label>${t('cur')}<select id="rcu">${opt(curs(),disp)}</select></label><label>${t('every')}<input id="re" type="number" min="1" value="1" style="width:80px"></label><label>${t('first')}<input id="rf" type="date" value="${today()}"></label><button class="b" onclick="addR()">${t('add')}</button></div></div>
<div class="card sc"><table>${rows}</table></div>`}
async function addR(){const a=parseFloat($('#ra').value),d=$('#rd').value,c=$('#rc').value;if(!(a>0)||d===c)return;st.rules.push({desc:$('#rt').value.trim().slice(0,120)||'-',d,c,amt:a,cur:$('#rcu').value,every:Math.max(1,parseInt($('#re').value)||1),next:$('#rf').value||today()});await autorun();await save();draw()}
async function delR(i){st.rules.splice(i,1);await save();draw()}
function settings(){return`<div class="card"><h3>${t('acctsec')}</h3><div class="row"><label>${t('npw')}<input id="np1" type="password" autocomplete="new-password"></label><label>${t('npw2')}<input id="np2" type="password" autocomplete="new-password"></label><button class="b" onclick="chPw()">${t('chpw')}</button><button class="b g" onclick="outAll()">${t('outall')}</button></div><p class="mut">${t('pwh')}</p><p id="pe"></p></div><div class="card"><h3>${t('set')}</h3><p>${t('sec')}</p><div class="row"><button class="b" onclick="verify()">${t('verify')}</button><button class="b g" onclick="exportCsv()">${t('exp')}</button><button class="b g" onclick="wipe()">${t('wipe')}</button></div><p id="vr"></p></div>
`}
async function setRate(c,v){v=parseFloat(v);if(v>0){st.rates[c]=v;await save()}}
async function verify(){let prev='0';for(const e of st.entries){const h=await sha(prev+JSON.stringify([e.id,e.date,e.desc,e.cur,e.rate,e.lines]));if(e.prev!==prev||e.hash!==h){$('#vr').innerHTML=`<span class="bad">${t('tamp')}${e.id}</span>`;return}prev=e.hash}
$('#vr').innerHTML=`<span class="ok">${t('good')} ${st.entries.length}</span>`}
async function wipe(){if(confirm('?')){st=seed();await save();draw()}}
function draw(){document.documentElement.dataset.th=th;document.documentElement.lang=L[li];document.documentElement.dir=li===3?'rtl':'ltr';
const sel=`<select aria-label="language" onchange="setLang(+this.value)">${[['0','Indonesia'],['1','English'],['2','中文'],['3','العربية']].map(([v,l])=>`<option value="${v}"${+v===li?' selected':''}>${l}</option>`).join('')}</select>`;
if(view==='terms'||view==='privacy'){legal();return}
if(!st&&view==='land'&&!rec&&!msg){landing(sel);return}
if(!st){const bt=(m,l,c='')=>`<button class="b ${c}" onclick="authGo('${m}')">${t(l)}</button>`;
const body=!cfgOk()?`<p class="bad">${t('conf')}</p>`:rec?`<div class="row" style="flex-direction:column;align-items:stretch"><input id="pw" type="password" autocomplete="new-password" placeholder="${esc(t('newpw'))}"></div><p>${bt('n','setpw')}</p>`
:`<p>${bt('g','google')}</p><div class="row" style="flex-direction:column;align-items:stretch"><input id="em" type="email" autocomplete="email" placeholder="${esc(t('email'))}"><input id="pw" type="password" autocomplete="current-password" placeholder="${esc(t('pw'))}" onkeydown="if(event.key==='Enter')authGo('in')"></div><p>${bt('in','signin')} ${bt('up','signup','g')} ${bt('f','forgot','g')}</p>`;
$('#app').innerHTML=`<div class="card" id="lock"><h1>Zui Akuntansi</h1><p class="mut">${t('l_badge')}</p>${body}<p class="bad" id="m">${esc(msg)}</p><p class="mut" style="font-size:13px">${t('l_agree')} <a href="#" onclick="openLegal('terms','auth');return false">${t('terms')}</a> ${t('l_and')} <a href="#" onclick="openLegal('privacy','auth');return false">${t('privacy')}</a>.</p><div class="row">${sel}<button class="b g" onclick="view='land';msg='';draw()">←</button></div></div>`;return}
const v={dash:dashboard,rep:report,gl:ledgerTab,jrn:journal,inv:invoices,bank:bank,aut:auto,cfg:cfg}[tab]();
$('#app').innerHTML=`<header><h1 style="margin:0;display:flex;gap:10px;align-items:center"><button class="lg" onclick="toggleMenu()" aria-label="Menu" title="Menu"><svg width="30" height="30" viewBox="0 0 30 30"><rect width="30" height="30" rx="9" fill="var(--ac)"/><path d="M9 9h12L9 21h12" stroke="var(--onac)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Zui Akuntansi</h1><div class="row">${meChip()}${wsSel()}</div></header><div class="shell${mhide?' hide':''}"><nav class="${mopen?'open':''}">${['dash','rep','gl','jrn','inv','bank','aut','cfg'].map(k=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';mopen=false;draw()">${IC[k]} ${t(k)}</button>`).join('')}</nav><div id="scrim" class="${mopen?'on':''}" onclick="toggleMenu()"></div><main>${v}</main></div>`;if(tab==='cfg'&&cs==='team')teamLoad()}
boot();
</script></body></html>
